name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build (linux/amd64)
        run: GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/azops-linux-amd64 ./cmd/azops

      - name: Build (windows/amd64)
        run: GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/azops-windows-amd64.exe ./cmd/azops

      - name: Build (darwin/amd64)
        run: GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/azops-darwin-amd64 ./cmd/azops

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
          retention-days: 7

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binaries
        run: |
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o dist/azops-linux-amd64   ./cmd/azops
          GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o dist/azops-linux-arm64   ./cmd/azops
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/azops-windows-amd64.exe ./cmd/azops
          GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o dist/azops-darwin-amd64  ./cmd/azops
          GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o dist/azops-darwin-arm64  ./cmd/azops

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
